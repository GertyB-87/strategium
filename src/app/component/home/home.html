<h1>Matches</h1>
<div class="home-buttons">
  <button
      type="button"
      (click)="openCreateTableTopMatchDialog()"
      aria-haspopup="dialog"
    mat-stroked-button
      class="open-dialog-btn"
  >
    <mat-icon>add</mat-icon> Create Tabletop Match
  </button>

  <button
      type="button"
      (click)="openCreateFabMatchDialog()"
      aria-haspopup="dialog"
    mat-stroked-button
      class="open-dialog-btn fab-btn"
  >
    <mat-icon>account_tree</mat-icon> Create FAB Match
  </button>
</div>
