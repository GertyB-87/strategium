<a class="skip-link" href="#main-content" (click)="$event.preventDefault(); mainContent.focus()">Skip to content</a>
<header class="top-nav">
    <nav class="main-nav-container" aria-label="Main navigation">
        <a class="main-nav-app-logo" routerLink="/">Strategium</a>
        <div class="main-nav-menu-container">
            <a class="main-nav-menu-item" routerLink="/" routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
            <a class="main-nav-menu-item" routerLink="/tabletop-match" routerLinkActive="active"
                ariaCurrentWhenActive="page">Tabletop Match</a>
            <a class="main-nav-menu-item" routerLink="/fab-match" routerLinkActive="active"
                ariaCurrentWhenActive="page">FAB Match</a>
        </div>
    </nav>
</header>
<main #mainContent id="main-content" tabindex="-1">
    @if (storage.error(); as message) {
        <p class="storage-warning" role="alert">{{ message }}</p>
    }
    <router-outlet (activate)="mainContent.focus()" />
</main>
